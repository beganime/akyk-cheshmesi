map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 256M;
    client_body_timeout 600s;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ~ ^/(privacy|terms|support|login|messenger)/?$ {
        root /usr/share/nginx/html;
        try_files /$1.html =404;
    }

    location ~ ^/(styles\.css|webapp\.css|site\.css|landing-extra\.css|doppler\.css|sphere\.js|app\.js|site\.js|sw\.js)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /vendor/ {
        root /usr/share/nginx/html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
    }

    location /static/ {
        alias /var/www/static/;
    }

    location /media/avatars/ {
        alias /var/www/media/avatars/;
    }

    location /media/website/ {
        alias /var/www/media/website/;
    }

    location /media/ {
        return 404;
    }

    location /_protected_media/ {
        internal;
        alias /var/www/media/;
        add_header Accept-Ranges bytes;
    }

    location /ws {
        proxy_pass http://go-realtime:8081;
        proxy_http_version 1.1;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
