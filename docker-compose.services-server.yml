services:
  nginx:
    ports: !override
      - "127.0.0.1:8104:80"
    volumes:
      - ./deploy/nginx/conf.d/services-server.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    networks:
      default:
      sl_services_internal:
        aliases:
          - akylchat-internal

networks:
  sl_services_internal:
    external: true
    name: sl-services-internal
