<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход - Akyl Cheshmesi</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/doppler.css">
</head>
<body class="auth-body">
  <main class="auth-layout">
    <section class="auth-panel">
      <a class="brand" href="/"><span class="brand-mark">A</span><span>Akyl Cheshmesi</span></a>
      <p class="auth-kicker">Web messenger</p>
      <h1>С возвращением</h1>
      <p>Используйте email или username и пароль от аккаунта мобильного приложения. После входа откроется веб-версия чата.</p>
      <form id="loginForm" class="auth-form">
        <label>
          <span>Email или username</span>
          <input id="email" type="text" autocomplete="username" required placeholder="you@example.com или username">
        </label>
        <label>
          <span>Пароль</span>
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <button type="submit" class="primary-action full">Войти в мессенджер</button>
        <div id="loginMessage" class="form-message" role="status"></div>
      </form>
      <div class="auth-links">
        <a href="/">Главная</a>
        <a href="/privacy/">Конфиденциальность</a>
      </div>
    </section>
    <section class="auth-visual" aria-label="Akyl Cheshmesi">
      <div class="auth-signal"><span>AC</span><strong>Разговор продолжается здесь.</strong><p>Чаты, медиа, истории и звонки в одном защищённом кабинете.</p></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
